<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ===== Use your provided CSS ===== */

 *  {
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  margin: 0;
  background: #f5f7fb;
}

.wrapper {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: #e0e0e0;
  padding: 15px;
  transition: width 0.3s ease;
}

.sidebar.closed {
  width: 60px;
}

.brand {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  margin-bottom: 20px;
}

.sidebar.closed .brand span:first-child {
  display: none;
}

.profile {
  text-align: center;
  margin-bottom: 25px;
  transition: opacity 0.3s ease;
}

.sidebar.closed .profile {
  opacity: 0;
  pointer-events: none;
}

.profile img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #ccc;
  margin-bottom: 10px;
}

.profile h4 {
  margin: 5px 0 0;
  font-size: 14px;
}

.profile p {
  margin: 0;
  font-size: 12px;
  color: #555;
}

.menu a {
  display: flex;
  align-items: center;
  padding: 12px;
  margin-bottom: 6px;
  text-decoration: none;
  color: #000;
  border-radius: 6px;
  font-size: 14px;
  gap: 12px;
}

.menu a i {
  width: 20px;
  text-align: center;
  font-size: 16px;
}

.menu a:hover {
  background: #cfcfcf;
}

.menu a.active {
  background: #bdbdbd;
  font-weight: bold;
}

.sidebar.closed .menu a {
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
  font-size: 0;
  gap: 0;
}

.sidebar.closed .menu a i {
  font-size: 18px;
  width: auto;
}

/* ===== MAIN ===== */
.main {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

.header {
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #333 !important;
}

/* ===== PROFILE CONTAINER ===== */
.profile-container {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

/* ===== LEFT CARD ===== */
.profile-left {
  background: #ffffff;
  width: 300px;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

.profile-image {
  text-align: center;
  margin-bottom: 15px;
}

.profile-image img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #eaeaea;
}

.profile-name {
  text-align: center;
  margin: 10px 0 20px;
}

/* ===== FORM FIELDS ===== */
.profile-field {
  margin-bottom: 15px;
}

.profile-field label {
  font-size: 13px;
  color: #666;
  display: block;
  margin-bottom: 6px;
}

.profile-field input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: #f9fafc;
}

/* ===== BUTTON ===== */
.btn {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #5a2d82;
  color: white;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 15px;
}

.btn:hover {
  background: #4a256d;
}

/* ===== RIGHT CONTENT ===== */
.profile-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ===== INFO CARD ===== */
.info-card {
  background: #ffffff;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.06);
}

.info-card h3 {
  margin-top: 0;
  margin-bottom: 15px;
  font-size: 18px;
}

/* ===== GRID ===== */
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.info-grid label {
  font-size: 13px;
  color: #666;
  display: block;
  margin-bottom: 6px;
}

.info-grid input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: #f9fafc;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .profile-container {
    flex-direction: column;
  }

  .profile-left {
    width: 100%;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>

<div class="wrapper">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span>TERLAJAK LARIS</span>
      <span class="toggle-btn" onclick="toggleSidebar()">☰</span>
    </div>

    <div class="profile">
      <img src="https://i.imgur.com/7k12EPD.png">
      <h4>AMIRUL AIMAN BIN LEO</h4>
      <p>HOD IT</p>
    </div>

    <div class="menu">
      <a><i class="fas fa-th-large"></i>Dashboard</a>
      <a  class="active"><i class="fas fa-user"></i>Profile</a>
      <a><i class="fas fa-calendar-plus"></i>Apply Leave</a>
      <a><i class="fas fa-history"></i>Leave History</a>
      <a><i class="fas fa-bell"></i>Notifications</a>
      <a><i class="fas fa-sign-out-alt"></i>Logout</a>
    </div>
  </div>

    <!-- ===== MAIN CONTENT ===== -->
<div class="main">

  <div class="header" style="color: #ffffff;">My Profile</div>

  <div class="profile-container">

    <!-- ===== LEFT PROFILE CARD ===== -->
    <div class="profile-left">
      <div class="profile-image">
        <img src="images/default_profile.png" alt="Profile">
      </div>

      <h2 class="profile-name">Son Hyun-Woo</h2>

      <div class="profile-field">
        <label>Email</label>
        <input type="email" value="sonhyun@terlajaklaris.com" readonly>
      </div>

      <div class="profile-field">
        <label>Password</label>
        <input type="password" value="********">
      </div>

      <button class="btn">Change Password</button>

      <div class="profile-field">
        <label>Profile Image</label>
        <input type="file">
      </div>
    </div>

    <!-- ===== RIGHT CONTENT ===== -->
    <div class="profile-right">

      <!-- ===== PERSONAL INFO ===== -->
      <div class="info-card">
        <h3>Personal Information</h3>

        <div class="info-grid">
          <div>
            <label>Employee ID</label>
            <input type="text" value="102345" readonly>
          </div>

          <div>
            <label>Full Name</label>
            <input type="text" value="Son Hyun-Woo" readonly>
          </div>

          <div>
            <label>Date of Birth</label>
            <input type="text" value="18/06/1992" readonly>
          </div>

          <div>
            <label>Address</label>
            <input type="text" value="Dobong-gu" readonly>
          </div>

          <div>
            <label>Admission Date</label>
            <input type="text" value="25/07/2019" readonly>
          </div>

          <div>
            <label>Department</label>
            <input type="text" value="IT" readonly>
          </div>
            
            <div>
            <label>Role</label>
            <input type="text" value="STAFF" readonly>
          </div>

          <div>
            <label>Position</label>
            <input type="text" value="Software Engineer" readonly>
          </div>
        </div>
      </div>

      <!-- ===== LEAVE INFO ===== -->
      <div class="info-card">
        <h3>Leave Information</h3>

        <div class="info-grid">
          <div>
            <label>Annual Leave Entitlement</label>
            <input type="text" value="14 Days" readonly>
          </div>

          <div>
            <label>Emergency Leave Entitlement</label>
            <input type="text" value="2 Days" readonly>
          </div>

          <div>
            <label>Medical Leave Entitlement</label>
            <input type="text" value="14 Days" readonly>
          </div>
            
            <div>
            <label>Maternity Leave Entitlement</label>
            <input type="text" value="14 Days" readonly>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('closed');
}

/* Filter table by status */
function filterStatus() {
  const filter = document.getElementById("statusFilter").value.toLowerCase();
  const table = document.getElementById("leaveTable");
  const trs = table.tBodies[0].getElementsByTagName("tr");

  for (let i = 0; i < trs.length; i++) {
    const status = trs[i].getElementsByTagName("td")[4].textContent.toLowerCase();
    trs[i].style.display = (filter === "all" || status === filter) ? "" : "none";
  }
}


</script>

</body>
</html>
