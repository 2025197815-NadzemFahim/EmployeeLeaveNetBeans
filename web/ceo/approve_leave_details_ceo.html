<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leave Details</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  display: flex;
  min-height: 100vh;
  background: #f2f2f2;
}

/* ===== Wrapper ===== */
.wrapper {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 260px;
  background: #e0e0e0;
  padding: 15px;
  transition: width 0.3s ease;
}

.sidebar.closed {
  width: 60px;
}

.brand {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
  margin-bottom: 20px;
}

.sidebar.closed .brand span:first-child {
  display: none;
}

.profile {
  text-align: center;
  margin-bottom: 25px;
  transition: opacity 0.3s ease;
}

.sidebar.closed .profile {
  opacity: 0;
  pointer-events: none;
}

.profile img {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #ccc;
  margin-bottom: 10px;
}

.profile h4 {
  margin: 5px 0 0;
  font-size: 14px;
}

.profile p {
  margin: 0;
  font-size: 12px;
  color: #555;
}

.menu a {
  display: flex;
  align-items: center;
  padding: 12px;
  margin-bottom: 6px;
  text-decoration: none;
  color: #000;
  border-radius: 6px;
  font-size: 14px;
  gap: 12px;
}

.menu a i {
  width: 20px;
  text-align: center;
  font-size: 16px;
}

.menu a:hover {
  background: #cfcfcf;
}

.menu a.active {
  background: #bdbdbd;
  font-weight: bold;
}

.sidebar.closed .menu a {
  justify-content: center;
  padding-left: 0;
  padding-right: 0;
  font-size: 0;
  gap: 0;
}

.sidebar.closed .menu a i {
  font-size: 18px;
  width: auto;
}

/* ===== Main ===== */
.main {
  flex: 1;
  padding: 20px;
}

.header {
  background: linear-gradient(to right, #bdbdbd, #eeeeee);
  padding: 18px;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 20px;
}

.content {
  padding: 40px;
}

/* ===== Card & Form ===== */
.card {
  max-width: 850px;
  margin: auto;
  background: #fff;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.2);
}

.form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.label {
  width: 140px;
  font-weight: 600;
  font-size: 14px;
}

input, textarea {
  flex: 1;
  padding: 6px 8px;
  font-size: 13px;
  border: 1px solid #aaa;
  background-color: #f9f9f9;
  color: #333;
}

textarea {
  height: 80px;
  resize: none;
}

.leave-color {
  width: 18px;
  height: 18px;
  background: #6aff00;
  border: 1px solid #555;
}

.attachment {
  background: #666;
  color: #fff;
  padding: 6px 14px;
  font-size: 13px;
}

.buttons {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 25px;
}

.btn {
  padding: 8px 22px;
  border: none;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

.back { background: #555; }
.reject { background: #e53935; }
.approve { background: #2ecc71; }

/* Disabled/Readonly styles */
input:read-only, textarea:read-only {
  background-color: #f5f5f5;
  cursor: default;
}

input:disabled, textarea:disabled {
  background-color: #f5f5f5;
  cursor: default;
}

input[readonly] {
  background-color: #f5f5f5;
  cursor: default;
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span>TERLAJAK LARIS</span>
      <span class="toggle-btn" onclick="toggleSidebar()">☰</span>
    </div>

    <div class="profile">
      <img src="https://i.imgur.com/7k12EPD.png">
      <h4>AHMAD BADRUL BIN SAIFUL</h4>
      <p>CEO</p>
    </div>

    <div class="menu">
      <a><i class="fas fa-th-large"></i>Dashboard</a>
      <a><i class="fas fa-user"></i>Profile</a>
      <a class="active"><i class="fas fa-clipboard-list"></i>Requests</a>
      <a><i class="fas fa-bell"></i>Notifications</a>
      <a><i class="fas fa-sign-out-alt"></i>Logout</a>
    </div>
  </div>

  <div class="main">
    <div class="header" style="color: #ffffff;">Approve/Reject Leave</div>

    <div class="content">
      <div class="card">
        <div class="form">
          <div class="row"><div class="label">Name</div><input value="Lee Han" readonly></div>
          <div class="row"><div class="label">ID</div><input value="21345" readonly></div>
          <div class="row"><div class="label">Position</div><input value="HOD Finance" readonly></div>
          <div class="row"><div class="label">Leave ID</div><input value="L010" readonly></div>
          <div class="row">
            <div class="label">Start Date</div>
            <input value="22-02-2025" readonly>
          </div>
          <div class="row">
            <div class="label">Leave Type</div>
            <div class="leave-color"></div>
            <input value="Emergency Leave (6)" readonly>
          </div>
          <div class="row">
            <div class="label">End Date</div>
            <input value="26-02-2025" readonly>
          </div>
          <div class="row" style="grid-column:1/3">
            <div class="label">Reason for Leave</div>
            <textarea readonly>Family emergency.</textarea>
          </div>
          <div class="row">
            <div class="label">Attachment</div>
            <div class="attachment">MC Letter.pdf</div>
          </div>
        </div>

        <div class="buttons">
          <button class="btn back" onclick="history.back()">Back</button>
          <button class="btn reject">Reject</button>
          <button class="btn approve">Approve</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('closed');
}
</script>

</body>
</html>
