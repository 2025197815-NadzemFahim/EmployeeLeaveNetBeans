<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Update Employee Information Interface</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        
        <style>
            /* ================= GLOBAL RESET ================= */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Segoe UI", sans-serif;
            }

            body {
                background: #f2f2f2;
                overflow-x: hidden;
            }

            /* ================= LAYOUT ================= */
            .wrapper {
                display: flex;
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* ---------- SIDEBAR ---------- */
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;              /* full viewport height */
                left: 0;
                width: 260px;
                background: #e0e0e0;
                padding: 15px;
                overflow: hidden;      /* no scrollbar */
                transition: width 0.3s ease;
                z-index: 100;
            }

            .sidebar.closed {
                width: 60px;
            }

            /* ================= SIDEBAR BRAND ================= */
            .brand {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                margin-bottom: 20px;
            }

            .sidebar.closed .brand span:first-child {
                display: none;
            }

            /* ================= PROFILE (SIDEBAR) ================= */
            .profile {
                text-align: center;
                margin-bottom: 25px;
                transition: opacity 0.3s ease;
            }

            .sidebar.closed .profile {
                opacity: 0;
                pointer-events: none;
            }

            .profile img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                object-fit: cover;
                background: #ccc;
                margin-bottom: 10px;
            }

            .profile h4 {
                margin: 5px 0 0;
                font-size: 14px;
            }

            .profile p {
                margin: 0;
                font-size: 12px;
                color: #555;
            }

            /* ================= MENU ================= */
            .menu a,
            .menu-parent {
                display: flex;
                align-items: center;
                padding: 12px;
                margin-bottom: 6px;
                text-decoration: none;
                color: #000;
                border-radius: 6px;
                font-size: 14px;
                gap: 12px;
            }

            .menu a i {
                width: 20px;
                text-align: center;
                font-size: 16px;
            }

            .menu a:hover {
                background: #cfcfcf;
            }

            .menu a.active {
                background: #bdbdbd;
                font-weight: bold;
            }

            /* ================= DROPDOWN ================= */
            .menu-group .menu-parent {
                font-weight: 600;
            }

            .menu-group .menu-parent::after {
                content: "▼";
                font-size: 10px;
                margin-left: auto;
                margin-right: 10px;
                transition: transform 0.2s ease;
            }

            .menu-group .menu-parent.open::after {
                transform: rotate(180deg);
            }

            .menu-group .submenu {
                margin-left: 32px;
                display: none;
                flex-direction: column;
            }

            .menu-group .submenu.open {
                display: flex;
            }

            /* ================= MAIN CONTENT ================= */
            .main {
                margin-left: 260px;
                width: calc(100% - 260px);
                padding: 30px;
            }

            /* ================= PAGE TITLE ================= */
            .page-title {
                max-width: 1100px;
                margin: 0 auto 30px auto;
                padding: 18px 24px;
                font-size: 32px;
                font-weight: 700;
                background: linear-gradient(to right, #bdbdbd, #f5f5f5);
            }

            /* ================= PAGE CONTENT ================= */
            .page-content {
                max-width: 1100px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 30px;
            }

            /* ================= PROFILE HEADER CARD ================= */
            .profile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .profile-left {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .profile-left img {
                width: 110px;
                height: 110px;
                border-radius: 50%;
            }
            
            .profile-left h2 {
                font-size: 26px;
                font-weight: 700;
                margin-bottom: 6px;
            }

            .profile-left p {
                font-size: 15px;
                color: #666;
            }



            .status {
                padding: 14px 40px;          /* 🔥 wider pill */
                font-size: 16px;             /* bigger text */
                font-weight: 700;
                border-radius: 999px;

                border: 2px solid #4caf50;
                color: #2e7d32;
                letter-spacing: 0.3px;

                min-width: 160px;            /* ensures width consistency */
                text-align: center;
                margin-right: 50px;
            }


            /* ================= CARDS ================= */
            .card {
                background: #ffffff;
                border-radius: 14px;
                padding: 30px;
            }

            .card h3 {
                margin-bottom: 18px;
                font-size: 18px;
                font-weight: 600;
            }

            /* ================= FORM ================= */
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 30px;
            }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                display: block;
            }

            .form-group input {
                width: 100%;
                height: 38px;
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
            }
            
            .form-group select {
                width: 100%;
                height: 38px;
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 14px;
                background: #fff;
            }
            
            .form-group textarea {
                width: 100%;
                min-height: 90px;   /* 👈 controls height */
                padding: 10px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 14px;
                resize: vertical;  /* user can resize */
            }
            
            .form-group.full {
                grid-column: 1 / -1;
            }

            /* ================= FORM ACTION BUTTONS ================= */
            .form-actions {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin: 40px auto 20px;
                max-width: 1100px;
                width: 100%;

            }

            .form-actions .btn-back,
            .form-actions .btn-cancel,
            .form-actions .btn-submit{
                flex: 1;
                height: 45px;
                font-size: 14px;
                font-weight: 600;
                border-radius: 6px;
                cursor: pointer;
                border: none;
            }

            /* Individual button colors */
            .btn-back {
                background: #555;
                color: #fff;
            }

            .btn-cancel {
                background: #ff2b2b;
                color: #fff;
            }

            .btn-submit {
                background: #00c853;
                color: #fff;
            }
            
            /* Allow scrolling but hide scrollbar */

            /* Chrome, Edge, Safari */
            ::-webkit-scrollbar {
                width: 0px;
                height: 0px;
            }

            /* Firefox */
            * {
                scrollbar-width: none;
            }

            /* IE / old Edge */
            * {
                -ms-overflow-style: none;
            }
            
            body {
                overflow: auto;
                overscroll-behavior: none;
            }

        </style>
    </head>
    <body>
        <div class="wrapper">
            <!-- ================= SIDEBAR ================= -->
            <div class="sidebar" id="sidebar">
                
                <!-- Brand / Toggle -->
                <div class="brand">
                    <span>TERLAJAK LARIS</span>
                    <span class="toggle-btn">☰</span>
                </div>

                <!-- User Profile -->
                <div class="profile">
                    <img src="https://i.imgur.com/7k12EPD.png" alt="Profile Picture">
                    <h4>AMIRUL AIMAN BIN LEO</h4>
                    <p>Admin</p>
                </div>

                <!-- Navigation Menu -->
                <div class="menu">
                    <a href="#"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
                    <a href="#" class="active"><i class="fas fa-users"></i><span>Employees</span></a>
                    <a href="#"><i class="fas fa-file-lines"></i><span>Policies</span></a>
                    <a href="#"><i class="fas fa-clipboard"></i><span>Reports</span></a>

                    <!-- Dropdown Menu -->
                    <div class="menu-group">
                        <div class="menu-parent">
                            <i class="fas fa-user"></i><span>Personal</span>
                        </div>
                    
                        <div class="submenu">
                            <a href="#"><i class="fas fa-id-badge"></i><span>Profile</span></a>
                            <a href="#"><i class="fas fa-calendar-plus"></i><span>Apply Leave</span></a>
                            <a href="#"><i class="fas fa-history"></i><span>Leave History</span></a>
                            <a href="#"><i class="fas fa-folder-open"></i><span>Generate Record</span></a>
                        </div>
                    </div>

                    <a href="#"><i class="fas fa-bell"></i><span>Notifications</span></a>
                    <a href="#"><i class="fas fa-right-from-bracket"></i><span>Logout</span></a>
                </div>
            </div>
            
            <form class="main" id="employeeForm" method="post" action="updateEmployee">
                
                <!-- PAGE TITLE -->
                <div class="page-title">
                    Employee Information
                </div>

                <!-- PAGE CONTENT (CENTERED) -->
                <div class="page-content">

                    <!-- EMPLOYEE HEADER CARD -->
                    <div class="card profile-header">
                        <div class="profile-left">
                            <img src="https://i.imgur.com/7k12EPD.png" alt="Employee">
                            <div>
                                <h2>Son Hyun-Woo</h2>
                                <p>sonhyun@terlajaklaris.com</p>
                            </div>
                        </div>

                        <div class="status">Available</div>
                    </div>

                    <!-- PERSONAL INFORMATION -->
                    <div class="card">
                        <h3>Personal Information</h3>

                        <div class="form-grid">
                            
                            <div class="form-group">
                                <label>Employee ID</label>
                                <input type="text" id="employeeID" value="102345" disabled>
                            </div>

                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" name="name" id="name">
                            </div>

                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" name="DoB" id="DoB">
                            </div>

                            <div class="form-group">
                                <label>Email</label>
                                <input type="text" name="email" id="email">
                            </div>

                            <div class="form-group">
                                <label>Role</label>
                                <select name="role" id="role" class="role-dropdown">
                                    <option value="">Select Role</option>
                                    <option value="admin">ADMIN</option>
                                    <option value="manager">STAFF</option>
                                    <option value="HOD">HEAD OF DIRECTOR</option>
                                    <option value="CEO">CHIEF EXECUTIVE OFFICER</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Department</label>
                                <input type="text" name="department" id="department" placeholder="Department">
                            </div>
                                
                            <div class="form-group">
                                <label>Position</label>
                                <input type="text" name="position" id="position" placeholder="Position">
                            </div>

                            <div class="form-group">
                                <label>Admission Date</label>
                                <input type="date" name="admissionDate" id="admissionDate">
                            </div>
                                
                            <div class="form-group full">
                                <label>Address</label>
                                <textarea name="address" id="address" placeholder="Address"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- LEAVE INFORMATION -->
                    <div class="card">
                        <h3>Leave Information</h3>

                        <div class="form-grid">
                            <div class="form-group">
                                <label>Annual Leave Entitlement</label>
                                <input type="number" name="annualLeave" id="annualLeave" min="0">
                            </div>

                            <div class="form-group">
                                <label>Emergency Leave Entitlement</label>
                                <input type="number" name="emergencyLeave" id="emergencyLeave" min="0">
                            </div>

                            <div class="form-group">
                                <label>Total Entitled Leave Per Year</label>
                                <input type="number" name="totalEntitled" id="totalEntitled" readonly disabled>
                            </div>

                            <div class="form-group">
                                <label>Total Carried Forward Leave</label>
                                <input type="number" name="carriedForward" id="carriedForward" min="0">
                            </div>

                            <div class="form-group">
                                <label>Total Annual Leave Available</label>
                                <input type="number" name="totalAvailable" id="totalAvailable" readonly disabled>
                            </div>

                            <div class="form-group">
                                <label>Medical Leave Entitlement</label>
                                <input type="number" name="medicalEntitlement" id="medicalEntitlement" min="0">
                            </div>

                            <div class="form-group">
                                <label>Unpaid Leave Taken</label>
                                <input type="number" name="unpaidLeave" id="unpaidLeave" min="0">
                            </div>

                            <div class="form-group">
                                <label>Medical Leave Taken</label>
                                <input type="number" name="medicalTaken" id="medicalTaken" min="0">
                            </div>

                            <div class="form-group">
                                <label>Replacement Leave Balance</label>
                                <input type="number" name="replaceLeave" id="replaceLeave" min="0">
                            </div>

                            <div class="form-group">
                                <label>Medical Leave Remaining</label>
                                <input type="number" name="medicalRemaining" id="medicalRemaining" readonly disabled>
                            </div>

                            <div class="form-group">
                                <label>Expected to Leave On</label>
                                <input type="date" name="expectedLeave" id="expectedLeave">
                            </div>

                            <div class="form-group">
                                <label>Expected to Return On</label>
                                <input type="date" name="returnDate" id="returnDate">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-back" onclick="confirmBack()">Back</button>
                        <button type="button" class="btn-cancel" onclick="confirmCancel()">Cancel</button>
                        <button type="submit" class="btn-submit">Submit</button>
                    </div>
                </div>
            </form>
        </div>
        
        <script>
            /* ================= SIDEBAR LOGIC ================= */
            document.querySelector(".toggle-btn").addEventListener("click", () => {
                document.getElementById("sidebar").classList.toggle("closed");
            });

            document.querySelectorAll(".menu-group").forEach(group => {
                const parent = group.querySelector(".menu-parent");
                const submenu = group.querySelector(".submenu");
                parent.addEventListener("click", () => {
                    parent.classList.toggle("open");
                    submenu.classList.toggle("open");
                });
            });
            
            let originalData = {};

            window.onload = () => {
                const inputs = document.querySelectorAll("#employeeForm input");
                inputs.forEach(i => originalData[i.id] = i.value);

                initDefaults();
                calculateLeave(); // ✅ DB values calculated on load
            };


            function confirmSubmit() {
                if (confirm("Are you sure you want to submit these changes?")) {
                    // 🔗 DB update later
                    alert("Changes submitted successfully!");
                    document.getElementById("employeeForm").submit();
                }
            }

            function confirmCancel() {
                if (confirm("Cancel all changes?")) {
                    document.querySelectorAll("#employeeForm input").forEach(i => {
                        i.value = originalData[i.id];
                    });
                    calculateLeave();
                }
            }


            function confirmBack() {
                if (confirm("Go back without saving changes?")) {
                    window.history.back();
                }
            }
            
            function initDefaults() {
                document.querySelectorAll('input[type="number"]').forEach(input => {
                    input.value = input.value || 0;
                });
            }



            function calculateLeave() {
                const annual = +document.getElementById("annualLeave").value || 0;
                const emergency = +document.getElementById("emergencyLeave").value || 0;
                const carried = +document.getElementById("carriedForward").value || 0;

                const medicalEnt = +document.getElementById("medicalEntitlement").value || 0;
                const medicalTaken = +document.getElementById("medicalTaken").value || 0;

                const totalEntitled = annual + emergency;
                const totalAvailable = totalEntitled + carried;
                const medicalRemaining = Math.max(0, medicalEnt - medicalTaken);

                document.getElementById("totalEntitled").value = totalEntitled;
                document.getElementById("totalAvailable").value = totalAvailable;
                document.getElementById("medicalRemaining").value = medicalRemaining;
            }

            [
                "annualLeave",
                "emergencyLeave",
                "carriedForward",
                "medicalEntitlement",
                "medicalTaken"
            ].forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener("input", () => {
                    input.value = Math.max(0, input.value);
                    calculateLeave();
                });
            });
        </script>
    </body>
</html>
