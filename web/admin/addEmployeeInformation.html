<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Add New Employee Information Interface</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        
        <style>
            /* ---------- GLOBAL RESET ---------- */
            * {
                box-sizing: border-box;
                font-family: "Segoe UI", sans-serif;
            }
            body {
                margin: 0;
                background: #f2f2f2;
            }

            /* ---------- MAIN LAYOUT ---------- */
            .wrapper {
                display: flex;
                min-height: 100vh;
            }

            /* ---------- SIDEBAR ---------- */
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;          /* ✅ exact viewport height */
                left: 0;
                width: 260px;
                background: #e0e0e0;
                padding: 15px;
                overflow: hidden;  /* ✅ no scrolling at all */
                transition: width 0.3s ease;
            }

            .sidebar.closed {
                width: 60px;
            }

            /* ---------- BRAND ---------- */
            .brand {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .sidebar.closed .brand span:first-child {
                display: none;
            }

            /* ---------- PROFILE ---------- */
            .profile {
                text-align: center;
                margin-bottom: 25px;
                transition: opacity 0.3s ease;
            }
            .sidebar.closed .profile {
                opacity: 0;
                pointer-events: none;
            }
            .profile img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                object-fit: cover;
                background: #ccc;
                margin-bottom: 10px;
            }
            .profile h4 {
                margin: 5px 0 0;
                font-size: 14px;
            }
            .profile p {
                margin: 0;
                font-size: 12px;
                color: #555;
            }

            /* ---------- MENU ---------- */
            .menu a, .menu-parent {
                display: flex;
                align-items: center;
                padding: 12px;
                margin-bottom: 6px;
                text-decoration: none;
                color: #000;
                border-radius: 6px;
                font-size: 14px;
                gap: 12px;
            }
            .menu a i {
                width: 20px;
                text-align: center;
                font-size: 16px;
            }
            .menu a:hover { background: #cfcfcf; }
            .menu a.active { background: #bdbdbd; font-weight: bold; }

            /* ---------- DROPDOWN ---------- */
            .menu-group .menu-parent { font-weight: 600; }
            .menu-group .menu-parent::after {
                content: "▼";
                font-size: 10px;
                margin-left: auto;
                margin-right: 10px;
                transition: transform 0.2s ease;
            }
            .menu-group .menu-parent.open::after { transform: rotate(180deg); }
            .menu-group .submenu {
                margin-left: 32px;
                display: none;
                flex-direction: column;
            }
            .menu-group .submenu.open { display: flex; }
            
            /* ================ MAIN ================= */
            .main {
                margin-left: 260px;                 /* offset sidebar */
                width: calc(100% - 260px);
                padding: 30px;
            }
            
            .page-title{
                max-width: 1100px;
                margin: 0 auto 30px auto;
                padding: 18px 24px;
                font-size: 32px;
                font-weight: 700;
                background: linear-gradient(to right, #bdbdbd, #f5f5f5);
            }
            
            .page-content {
                max-width: 1100px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                gap: 30px;
            }
            
            /* ================= CARD ================= */
            .card {
                background: #ffffff;
                border-radius: 14px;
                padding: 30px;
            }
            
            /* ================= FORM ================= */
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 30px;
            }

            .form-group label {
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                display: block;
            }

            .form-group input {
                width: 100%;
                height: 38px;
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
            }
            
            .form-group select {
                width: 100%;
                height: 38px;
                padding: 8px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 14px;
                background: #fff;
            }
            
            .form-group textarea {
                width: 100%;
                min-height: 90px;   /* 👈 controls height */
                padding: 10px 12px;
                border-radius: 8px;
                border: 1px solid #ccc;
                font-size: 14px;
                resize: vertical;  /* user can resize */
            }
            
            .form-group.full {
                grid-column: 1 / -1;
            }


            
            /* ================= BUTTON ================= */
            .form-actions {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin: 40px auto 20px;
                max-width: 1100px;
                width: 100%;

            }

            .form-actions .btn-back,
            .form-actions .btn-submit{
                flex: 1;
                height: 45px;
                font-size: 14px;
                font-weight: 600;
                border-radius: 6px;
                cursor: pointer;
                border: none;
            }

            /* Individual button colors */
            .btn-back {
                background: #555;
                color: #fff;
            }

            .btn-submit {
                background: #00c853;
                color: #fff;
            }
            
            /* Allow scrolling but hide scrollbar */

            /* Chrome, Edge, Safari */
            ::-webkit-scrollbar {
                width: 0px;
                height: 0px;
            }

            /* Firefox */
            * {
                scrollbar-width: none;
            }

            /* IE / old Edge */
            * {
                -ms-overflow-style: none;
            }
            
            body {
                overflow: auto;
                overscroll-behavior: none;
            }

        </style>
    </head>
    <body>
        <div class="wrapper">
            <!-- ================= SIDEBAR ================= -->
            <div class="sidebar" id="sidebar">
                
                <!-- Brand / Toggle -->
                <div class="brand">
                    <span>TERLAJAK LARIS</span>
                    <span class="toggle-btn">☰</span>
                </div>

                <!-- User Profile -->
                <div class="profile">
                    <img src="https://i.imgur.com/7k12EPD.png" alt="Profile Picture">
                    <h4>AMIRUL AIMAN BIN LEO</h4>
                    <p>Admin</p>
                </div>

                <!-- Navigation Menu -->
                <div class="menu">
                    <a href="#"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
                    <a href="#" class="active"><i class="fas fa-users"></i><span>Employees</span></a>
                    <a href="#"><i class="fas fa-file-lines"></i><span>Policies</span></a>
                    <a href="#"><i class="fas fa-clipboard"></i><span>Reports</span></a>

                    <!-- Dropdown Menu -->
                    <div class="menu-group">
                        <div class="menu-parent">
                            <i class="fas fa-user"></i><span>Personal</span>
                        </div>
                    
                        <div class="submenu">
                            <a href="#"><i class="fas fa-id-badge"></i><span>Profile</span></a>
                            <a href="#"><i class="fas fa-calendar-plus"></i><span>Apply Leave</span></a>
                            <a href="#"><i class="fas fa-history"></i><span>Leave History</span></a>
                            <a href="#"><i class="fas fa-folder-open"></i><span>Generate Record</span></a>
                        </div>
                    </div>

                    <a href="#"><i class="fas fa-bell"></i><span>Notifications</span></a>
                    <a href="#"><i class="fas fa-right-from-bracket"></i><span>Logout</span></a>
                </div>
            </div>
            
            <div class="main">
                
                <div class="page-title">Add New Employee</div>
                
                <!-- ================= PAGE CONTENT ================= -->
                <div class="page-content">
                    
                    <div class="card">
                        
                        <!-- FORM START -->
                        <form class="form" action="AddEmployeeServlet" method="post" enctype="multipart/form-data">
                            
                            <div class="form-grid">
                                
                                <div class="form-group">
                                    <label>Full Name</label>
                                    <input type="text" name="name" id="name" placeholder="Full Name" required>
                                </div>
                                
                                <div class="form-group">
                                    <label>Date Of Birth</label>
                                    <input type="date" name="DoB" id="DoB" required>
                                </div>

                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="text" name="email" id="email" placeholder="Email" required>
                                </div>
                                
                                <div class="form-group">
                                    <label>Password</label>
                                    <input type="password" name="password" id="password" placeholder="Password" required>
                                </div>

                                <div class="form-group">
                                    <label>Role</label>
                                    <select name="role" id="role" class="role-dropdown">
                                        <option value="">Select Role</option>
                                        <option value="admin">ADMIN</option>
                                        <option value="manager">STAFF</option>
                                        <option value="HOD">HEAD OF DIRECTOR</option>
                                        <option value="CEO">CHIEF EXECUTIVE OFFICER</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label>Department</label>
                                    <input type="text" name="department" id="department" placeholder="Department">
                                </div>
                                
                                <div class="form-group">
                                    <label>Position</label>
                                    <input type="text" name="position" id="position" placeholder="Position">
                                </div>
                                

                                
                                <div class="form-group">
                                    <label>Admission Date</label>
                                    <input type="date" name="admissionDate" id="admissionDate">
                                </div>
                                
                                <div class="form-group full">
                                    <label>Address</label>
                                    <textarea name="address" id="address" placeholder="Address"></textarea>
                                </div>
                                
                            </div>
                            
                            <div class="form-actions">
                                <button type="button" class="btn-back">Back</button>
                                <button type="submit" class="btn-submit">Create Employee</button>
                            </div>
                        </form>
                    </div>
                </div>   
            </div>
        </div>
        
        <script>
            /* ================= SIDEBAR LOGIC ================= */
            document.querySelector(".toggle-btn").addEventListener("click", () => {
                document.getElementById("sidebar").classList.toggle("closed");
            });

            document.querySelectorAll(".menu-group").forEach(group => {
                const parent = group.querySelector(".menu-parent");
                const submenu = group.querySelector(".submenu");
                parent.addEventListener("click", () => {
                    parent.classList.toggle("open");
                    submenu.classList.toggle("open");
                });
            });
            

            document.getElementById("profilePic").addEventListener("change", function () {
                const file = this.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = e => document.getElementById("preview").src = e.target.result;
                reader.readAsDataURL(file);
            });

        </script>
    </body>
</html>
